openapi: 3.1.0
info:
  title: Life OS Actions
  version: 2.0.0
servers:
  - url: https://YOUR_DOMAIN
paths:
  /api/actions/context:
    get:
      operationId: getLifeContext
      summary: Get typed goals, aliases, and open tasks for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current context }
  /api/actions/life-events:
    post:
      operationId: recordLifeEvents
      summary: Record an ordered life-event batch transactionally
      description: Do not include userId. New goals require one of seven fixed lifeArea values.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifeEventBatch" }
      responses:
        "200": { description: Recorded or idempotently replayed }
        "400": { description: Invalid command }
        "401": { description: Invalid credential }
components:
  schemas:
    LifeEventBatch:
      type: object
      additionalProperties: false
      required: [idempotencyKey, rawText, events]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        rawText: { type: string, minLength: 1, maxLength: 500 }
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            oneOf:
              - { $ref: "#/components/schemas/TaskEvent" }
              - { $ref: "#/components/schemas/ActivityEvent" }
              - { $ref: "#/components/schemas/GoalEvent" }
              - { $ref: "#/components/schemas/InboxEvent" }
    GoalReference:
      type: object
      additionalProperties: false
      required: [explicit]
      properties:
        title: { type: string }
        explicit: { type: boolean }
        candidateGoalId: { type: string, format: uuid }
        matchConfidence: { type: number, minimum: 0, maximum: 1 }
      anyOf:
        - { required: [title] }
        - { required: [candidateGoalId] }
    Metric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, value, unit]
          properties:
            type: { const: duration }
            value: { type: number, exclusiveMinimum: 0 }
            unit: { enum: [minute, hour] }
        - type: object
          additionalProperties: false
          required: [type, value, unit]
          properties:
            type: { enum: [count, milestone] }
            value: { type: number, exclusiveMinimum: 0 }
            unit: { const: count }
    ReminderChoice:
      oneOf:
        - type: object
          required: [mode]
          additionalProperties: false
          properties: { mode: { const: default } }
        - type: object
          required: [mode]
          additionalProperties: false
          properties: { mode: { const: none } }
        - type: object
          required: [mode, remindAt]
          additionalProperties: false
          properties:
            mode: { const: custom }
            remindAt: { type: string, format: date-time }
            repeatRule: { enum: [none, daily, weekly], default: none }
    TaskEvent:
      type: object
      additionalProperties: false
      required: [type, path, title, localDate, confidence]
      properties:
        type: { const: task }
        path: { enum: [one_off, goal] }
        title: { type: string }
        localDate: { type: string, format: date }
        confidence: { type: number, minimum: 0, maximum: 1 }
        priority: { enum: [low, normal, high], default: normal }
        goal: { $ref: "#/components/schemas/GoalReference" }
        metric: { $ref: "#/components/schemas/Metric" }
        reminder: { $ref: "#/components/schemas/ReminderChoice" }
      oneOf:
        - properties: { path: { const: one_off } }
          not: { required: [goal] }
        - properties: { path: { const: goal } }
          required: [path, goal]
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [type, summary, occurredOn, confidence]
      properties:
        type: { const: activity }
        summary: { type: string }
        occurredOn: { type: string, format: date }
        confidence: { type: number, minimum: 0, maximum: 1 }
        goal: { $ref: "#/components/schemas/GoalReference" }
        metric: { $ref: "#/components/schemas/Metric" }
    GoalEvent:
      type: object
      additionalProperties: false
      required: [type, goalType, title, category, lifeArea, confidence]
      properties:
        type: { const: goal }
        goalType: { enum: [long_term, short_term] }
        title: { type: string }
        category: { type: string }
        lifeArea: { enum: [work, growth, health, life, finance, relationships, entertainment] }
        metricType: { enum: [duration, count, milestone], default: count }
        aliases: { type: array, items: { type: string }, maxItems: 12 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    InboxEvent:
      type: object
      additionalProperties: false
      required: [type, reason, suggestedTypes, confidence]
      properties:
        type: { const: inbox }
        reason: { type: string }
        suggestedTypes:
          type: array
          items: { enum: [task, activity, goal, inbox] }
        confidence: { type: number, minimum: 0, maximum: 1 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
